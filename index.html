<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player | CodeAlpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

  <div class="art-wrap">
    <div class="art" id="art">
      <div class="art-bars">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="track-info">
    <h1 id="songTitle">Song Title</h1>
    <p id="songArtist">Artist Name</p>
  </div>

  <div class="progress-wrap">
    <span class="time" id="currentTime">0:00</span>
    <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
    <span class="time" id="duration">0:00</span>
  </div>

  <div class="controls">
    <button id="prevBtn" class="ctrl-btn" aria-label="Previous track">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button id="playBtn" class="ctrl-btn play-btn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button id="nextBtn" class="ctrl-btn" aria-label="Next track">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>

  <div class="volume-wrap">
    <svg viewBox="0 0 24 24" class="vol-icon"><path d="M5 9v6h4l5 5V4L9 9H5z"/></svg>
    <input type="range" id="volumeBar" value="70" min="0" max="100">
  </div>

  <div class="playlist" id="playlist">
    <p class="playlist-label">Playlist</p>
    <ul id="playlistItems"></ul>
  </div>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>
</body>
</html>
